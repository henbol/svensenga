<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Værstasjon</title>
    <style>
        /* Fjerner standard marger og setter høyden til 100% av skjermen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f4f4f4;
        }
        
        /* Gjør at iframen dekker hele skjermen */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Plasserer telleren flytende over kartet nede i venstre hjørne */
        .besoksteller {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: white;
            padding: 8px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 14px;
            color: #333;
            z-index: 1000; /* Sørger for at den alltid ligger øverst */
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <!-- Bytter inn Netatmo-kartet -->
    <iframe 
        src="https://weathermap.netatmo.com/?stationid=70:ee:50:7f:f9:98&zoom=14.748587811931849" 
        title="Netatmo Værkart"
        allowfullscreen>
    </iframe>

    <!-- Teller-boks -->
    <div class="besoksteller">
        Antall besøk: 
        <!-- Bildet som fungerer som teller. Den bruker domenenavnet ditt som ID -->
        <img src="https://api.visitorbadge.io/api/visitors?path=svensenga.no&countColor=%23000000" alt="Besøksteller">
    </div>

</body>
</html>
